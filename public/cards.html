<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>King Mimic — Card Library</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    body { display: block; padding: 24px; }
    h1 { color: var(--gold); letter-spacing: 3px; }
    .rules { color: var(--dim); max-width: 760px; line-height: 1.5; margin-bottom: 8px; }
    .filters { display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0; }
    .filters button { background: #1a1f29; color: var(--ink); border: 1px solid #2a2f3a; padding: 6px 12px; font-weight: 600; }
    .filters button.on { background: var(--gold); color: #1a1407; }
    .count { color: var(--dim); font-size: 13px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
    .card { background: var(--panel); border: 1px solid #232833; border-radius: 10px; padding: 12px; position: relative; }
    .card .name { font-weight: 700; }
    .card .stars { color: var(--gold); font-size: 12px; }
    .card .stat { color: #e88; font-size: 12px; font-weight: 700; }
    .card .type { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
    .card .text { margin-top: 6px; font-size: 13px; color: #d6dae2; line-height: 1.45; }
    .card .todo { color: #e6a; font-size: 11px; margin-top: 6px; }
    .tag { display: inline-block; background: #0e141d; border: 1px solid #243; color: #8fb; font-size: 10px; padding: 1px 6px; border-radius: 999px; margin: 6px 4px 0 0; }
    h2 { margin: 26px 0 6px; color: #9ad; border-bottom: 1px solid #232833; padding-bottom: 4px; }
  </style>
</head>
<body>
  <h1>KING MIMIC · CARD LIBRARY</h1>
  <p class="rules" id="rules"></p>
  <div class="filters" id="filters"></div>
  <div class="count" id="count"></div>
  <div id="sections"></div>
  <script src="/cards.js"></script>
</body>
</html>
