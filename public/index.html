<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0e1014" />
  <!-- installable "app": Add to Home Screen gets a fullscreen, chrome-less launch -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="King Mimic" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <title>King Mimic</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AD%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/map.css" />
  <link rel="stylesheet" href="/inventory.css" />
  <style>
    #draftOverlay { position: fixed; inset: 0; background: #060810e0; display: flex;
      align-items: flex-start; justify-content: center; overflow-y: auto; padding: 20px 0; z-index: 50; }
    #draftOverlay.hidden { display: none; }
    /* keep the level map clickable even while the won/loot overlay is up */
    #map { position: relative; z-index: 60; }
    /* …but that's a DESKTOP affordance (the map sits beside the overlay there). On
       phones the panels wrap UNDER the board, so z 60 made the map punch through
       full-screen menus at the bottom-left. Let overlays (z 50) cover it — their
       own ◀/▶ advance buttons choose the path on a phone. */
    @media (max-width: 980px) { #map { z-index: auto; } }
    .draft-card { background: #11151d; border: 1px solid #2a2f3a; border-radius: 12px;
      padding: 22px 24px; width: min(620px, 92vw); margin: auto; box-shadow: 0 10px 40px #000a; }
    .draft-card h2 { margin: 0 0 2px; color: #e6c34a; font: bold 20px ui-monospace, monospace; }
    .draft-sub { margin: 0 0 16px; color: #8b93a3; font: 12px ui-monospace, monospace; }
    .draft-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .draft-opt { text-align: left; background: #171b24; border: 2px solid #2a2f3a;
      border-radius: 9px; padding: 10px 12px; cursor: pointer; color: #e8e8ea;
      display: flex; flex-direction: column; gap: 3px; transition: border-color .08s, background .08s; }
    .draft-opt:hover:not(:disabled) { border-color: #4a5160; background: #1b2029; }
    .draft-opt.taken { border-color: #e6c34a; background: #221d10; }
    .draft-opt:disabled { opacity: .4; cursor: not-allowed; }
    .draft-opt .dn { font: bold 13px ui-monospace, monospace; }
    .draft-opt .dt { font: 11px ui-monospace, monospace; color: #aab2c0; }
    .draft-opt .dcd { font: 10px ui-monospace, monospace; color: #7f8898; }
    .draft-status { margin-top: 16px; color: #9aa3b2; font: 12px ui-monospace, monospace;
      display: flex; flex-wrap: wrap; gap: 6px 16px; }
    .draft-status .ready { color: #6c6; }
    .class-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .class-opt { text-align: left; background: #171b24; border: 2px solid #2a2f3a;
      border-radius: 9px; padding: 11px 13px; cursor: pointer; color: #e8e8ea;
      display: flex; flex-direction: column; gap: 4px; transition: border-color .08s, background .08s; }
    .class-opt:hover { border-color: #4a5160; background: #1b2029; }
    .class-opt.taken { border-color: #e6c34a; background: #221d10; }
    .class-opt .cn { font: bold 15px ui-monospace, monospace; }
    .class-opt .cstat { font: 12px ui-monospace, monospace; color: #cfd3dc; }
    .class-opt .cblurb { font: 11px ui-monospace, monospace; color: #9aa3b2; }
    .class-opt .ckit { margin: 4px 0 0; padding-left: 16px; }
    .class-opt .ckit li { font: 11px ui-monospace, monospace; color: #aab2c0; margin: 1px 0; }
    .class-opt .ckit b { color: #d7dbe4; }
    .stock-wide { width: min(760px, 94vw); }
    .foe-palette { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .foe-opt { background: #171b24; border: 1px solid #2a2f3a; border-radius: 8px; padding: 8px 10px;
      display: flex; flex-direction: column; gap: 3px; position: relative; }
    /* THE BIG ANTE NUMBER — what this option contributes toward the room's requirement */
    .foe-opt .fbig { position: absolute; top: 4px; right: 9px; font: 800 24px ui-monospace, monospace;
      color: #e6c34a; text-shadow: 0 2px 8px #000; }
    .foe-opt .fn { font: bold 12px ui-monospace, monospace; color: #e8e8ea; padding-right: 34px; }
    .foe-opt .fstat { font: 11px ui-monospace, monospace; color: #cfd3dc; }
    .foe-opt .fgear { font: 10px ui-monospace, monospace; color: #d9a3ff; }
    .foe-opt .fgear b { color: #e8c8ff; }
    .foe-opt .fpass { font: 10px ui-monospace, monospace; color: #7fd0ff; }
    .foe-opt .fante { color: #e6c34a; font-weight: bold; }
    .ante-ok { color: #6c6; } .ante-no { color: #e88; } .ante-over { color: #e6c34a; }
    .enchant-line { margin: 0 0 10px; font: 12px ui-monospace, monospace; color: #c9a9e0;
      background: #1c1626; border: 1px solid #3a2f4a; border-radius: 7px; padding: 7px 10px; }
    .enchant-line b { color: #e0c0ff; }
    .foe-opt .fadd { font: 10px ui-monospace, monospace; color: #7f8898; margin-top: 2px; }
    .lane-btn { font: 10px ui-monospace, monospace; background: #222a36; color: #cdd3dc;
      border: 1px solid #39404e; border-radius: 5px; padding: 2px 6px; margin-left: 3px; cursor: pointer; }
    .lane-btn:hover { background: #2d3646; border-color: #5a6270; }
    /* player-to-player trading (out of combat) */
    .trade-box { border-top: 1px solid #232a36; margin-top: 12px; padding-top: 4px; }
    .trade-give-row, .trade-kit { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; margin: 4px 0; }
    .trade-label { font: bold 11px ui-monospace, monospace; color: #8b93a3; margin-right: 4px; }
    .trade-item { font: 11px ui-monospace, monospace; background: #1a2230; color: #cdd3dc;
      border: 1px solid #39404e; border-radius: 5px; padding: 3px 7px; cursor: pointer; }
    .trade-item:hover:not(:disabled) { background: #243043; border-color: #5a6270; }
    .trade-item:disabled { opacity: .4; cursor: default; }
    .trade-item.sel { background: #3a2f12; border-color: #e6c34a; color: #ffe9a8; }
    .trade-party { display: flex; gap: 8px; align-items: baseline; margin: 4px 0; }
    .trade-who { font: bold 11px ui-monospace, monospace; color: #cfd3dc; min-width: 120px; }
    .trade-offer { font: 11px ui-monospace, monospace; color: #cdd3dc; background: #15202a;
      border: 1px solid #2a3a44; border-radius: 6px; padding: 5px 8px; margin-top: 5px; }
    .trade-offer.pending { color: #8b93a3; }
    .stock-lanes { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 12px; }
    .stock-lane { background: #0e1219; border: 1px solid #232a36; border-radius: 8px; padding: 8px;
      min-height: 90px; display: flex; flex-direction: column; gap: 4px; }
    .stock-lane-h { font: bold 11px ui-monospace, monospace; color: #8b93a3; text-align: center;
      border-bottom: 1px solid #232a36; padding-bottom: 4px; }
    .foe-chip { font: 11px ui-monospace, monospace; background: #2a1d1d; color: #f0c9c9;
      border: 1px solid #5a3030; border-radius: 5px; padding: 3px 6px; cursor: pointer; text-align: left; }
    .foe-chip:hover { background: #3a2424; border-color: #7a4040; }
    /* baseline rank-and-file: fixed (dim, not removable); greedy picks: gold, removable */
    .foe-chip.baseline { background: #161b24; color: #8b93a3; border-color: #2a3240; cursor: default; }
    .foe-chip.baseline:hover { background: #161b24; border-color: #2a3240; }
    .foe-chip.greedy { background: #2a2114; color: #f0d9a0; border-color: #7a5a30; }
    .foe-chip.greedy:hover { background: #38301c; border-color: #a07a40; }
    .lane-empty { font: 10px ui-monospace, monospace; color: #4a5160; text-align: center; margin: auto; }
    .stock-begin { margin-top: 14px; width: 100%; font: bold 14px ui-monospace, monospace;
      background: #e6c34a; color: #1a1407; border: none; border-radius: 8px; padding: 10px; cursor: pointer; }
    .stock-begin:disabled { background: #3a4150; color: #7f8898; cursor: not-allowed; }
    .advance-row { display: flex; gap: 10px; margin-top: 6px; }
    .advance-btn { flex: 1; font: bold 14px ui-monospace, monospace; background: #e6c34a;
      color: #1a1407; border: none; border-radius: 8px; padding: 12px; cursor: pointer; }
    .advance-btn.node-elite { background: #b9a06a; }
    .advance-btn.node-boss { background: #c46a6a; color: #fff; }
    .advance-btn:hover { filter: brightness(1.12); }
    .kit-item .dcd { color: #c98a8a; }
    .kit-item:hover { border-color: #7a4040; background: #2a1d1d; }
    .tre { color: #e6c34a; font-weight: bold; }
  </style>
</head>
<body>
  <div id="lobby" class="panel">
    <h1>KING MIMIC</h1>
    <p class="tag">Wear the bodies of the foes you defeat. Protect the caravan.</p>
    <input id="name" placeholder="Your name" maxlength="14" />
    <input id="code" placeholder="Room name (blank = random)" maxlength="8" autocapitalize="characters" />
    <button id="createBtn">Create room</button>
    <div class="or">— or —</div>
    <button id="joinBtn">Join existing room</button>
    <div id="lobbyErr" class="err"></div>
  </div>

  <div id="game" class="hidden">
    <aside id="map" class="side"><div class="side-title">LEVEL</div></aside>
    <div id="center">
      <div id="hud">
        <span id="roomCode"></span>
        <span id="caravan"></span>
        <span id="waveInfo"></span>
        <span id="bodyInfo"></span>
        <button id="startBtn">START</button>
        <button id="leaveBtn" class="ghost">Leave</button>
      </div>
      <canvas id="cv"></canvas>
      <div id="help">←/→ change lane &nbsp;·&nbsp; ↑/↓ step forward / back past teammates AND your summons (the front of the line blocks) &nbsp;·&nbsp; <b>Tab</b> or click a foe to aim &nbsp;·&nbsp; click an ally to aim heals &nbsp;·&nbsp; 1–9 use item &nbsp;·&nbsp; Q swap body</div>
    </div>
    <aside id="inventory" class="side"><div class="side-title">INVENTORY</div></aside>

    <!-- touch controls (phones only — body.touch gates visibility; desktop never sees these).
         Buttons send the SAME messages as the keyboard; the server can't tell them apart. -->
    <div id="touchHud">
      <div id="tDpad">
        <button class="tbtn" data-tk="fwd">▲</button>
        <button class="tbtn" data-tk="laneUp">◀</button>
        <button class="tbtn" data-tk="laneDown">▶</button>
        <button class="tbtn" data-tk="back">▼</button>
      </div>
      <div id="tActs">
        <button class="tbtn" data-tk="cycle">🎯</button>
        <button class="tbtn" data-tk="swap">🎭</button>
      </div>
    </div>
  </div>

  <div id="draftOverlay" class="hidden"></div>

  <script src="/client.js"></script>
  <script src="/map.js"></script>
  <script src="/inventory.js"></script>
</body>
</html>
