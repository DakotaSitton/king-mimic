name: CI

# Runs the deterministic engine test suites on every push and PR.
# Browser/tunnel/screenshot harnesses (shoot.mjs, mp-playtest.mjs, tap-probe.mjs) are intentionally
# EXCLUDED — they need real Edge + a tunnel and are not headless-CI safe.

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Engine tests (game)
        run: bun run test/game.test.js

      - name: Opening-room and baseline-loot contract
        run: bun run test/onboarding.test.js

      - name: Card expansion, art, and animation contracts
        run: |
          bun run test/card-expansion.test.js
          bun run test/card-art.test.js
          bun run test/card-animation.test.js

      - name: Summon and room-clock contracts
        run: |
          bun run test/baber-summons.test.js
          bun run test/clock.test.js

      - name: Body passive causal matrix
        run: bun run test/body-passives.test.js

      - name: Squad tests
        run: bun run test/squad.test.js

      - name: Telemetry provenance tests
        run: bun run test/telemetry.test.js

      - name: Resolver side-symmetry contract
        run: bun run test/symmetry.test.js

      - name: Stranger-facing public entry contract
        run: bun run test/public-entry.test.js

      - name: Active-run restart persistence
        run: bun run test/run-persistence.test.js

      - name: Fuzz (60 full runs, invariant checks)
        run: bun run test/fuzz.js

      - name: itch.io launcher package
        run: bun run test/itch-package.test.js

      - name: Serve smoke (fresh headless server)
        run: |
          PORT=3999 bun run server.js &
          SRV=$!
          for i in $(seq 1 40); do
            if curl -sf http://localhost:3999/ >/dev/null; then echo "server up"; break; fi
            sleep 0.5
          done
          BASE=http://localhost:3999 bun run test/serve.test.js
          kill "$SRV" 2>/dev/null || true
